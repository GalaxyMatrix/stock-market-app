services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - agent/.env
    environment:
      PORT: "8000"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s